name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site/lectures _site/BEEE_Units_1-5
          cp index.html _site/
          cp -r lectures/index.html lectures/pdf lectures/video _site/lectures/
          cp -r Lecture_Decks _site/Lecture_Decks
          cp Lecture_Decks.zip _site/
          cp BEEE_Units_1-5/BEEE_Units_1-5.pptx BEEE_Units_1-5/narration_script.json _site/BEEE_Units_1-5/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
